[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --html=reports/latest_execution_report.html
    --self-contained-html
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    e2e: End-to-end full customer journey tests
    smoke: Quick sanity verification tests
    regression: Full regression test suite
    cart: Shopping cart interaction tests
    auth: Authentication and registration tests

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] (%(filename)s:%(lineno)d): %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
