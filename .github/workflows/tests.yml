name: SeleniumHub Pro E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      data_source:
        description: 'Test Data Source (excel or json)'
        required: true
        default: 'excel'
        type: choice
        options:
          - excel
          - json
      browser:
        description: 'Target Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

jobs:
  e2e-tests:
    name: Run E2E Selenium Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Google Chrome
        if: matrix.browser == 'chrome'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Excel Test Data
        run: |
          python -m utilities.create_excel_data

      - name: Execute End-to-End Tests
        env:
          HEADLESS: "true"
          BROWSER: ${{ matrix.browser }}
          DATA_SOURCE: ${{ github.event.inputs.data_source || 'excel' }}
          AUT_NAME: "automationexercise"
        run: |
          pytest -v --browser=${{ matrix.browser }} --headless

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-test-reports-${{ matrix.browser }}
          path: reports/
          retention-days: 14

      - name: Upload Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.browser }}
          path: screenshots/
          retention-days: 14

      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ matrix.browser }}
          path: logs/
          retention-days: 14
